services:
  postgres:
    image: postgres:16-alpine
    container_name: hallmarq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hallmarq}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: hallmarq-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hallmarq-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hallmarq}?schema=public
      JWT_SECRET: ${JWT_SECRET:-this-is-a-very-secure-jwt-secret-with-at-least-32-chars!}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173,http://localhost:3000,http://localhost:80}
      TRUST_PROXY: 1
      BCRYPT_COST: 12
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-noreply@hallmarq.local}
      REQUIRE_EMAIL_VERIFICATION: "false"
      ENABLE_DOCS: "true"
      LOG_LEVEL: info
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hallmarq-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  pgdata:
